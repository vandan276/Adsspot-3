version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@9 turbo
            - cd ../..
            - pnpm install --no-frozen-lockfile --prod=false
            - cd apps/web
        build:
          commands:
            - cd ../..
            - turbo run build --filter=@adsspot/web...
            - cd apps/web
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - $(pnpm store path)
