version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@latest --activate
            - pnpm --version
            - npm install -g turbo
            - cd ../..
            - pnpm install --no-frozen-lockfile --prod=false
            - cd apps/web
        build:
          commands:
            - cd ../..
            - turbo run build --filter=@adsspot/web...
            - cd apps/web
            - if [ ! -d "node_modules/next" ]; then cp -rn ../../node_modules/* ./node_modules/ 2>/dev/null || true; fi
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
          - $(pnpm store path)
