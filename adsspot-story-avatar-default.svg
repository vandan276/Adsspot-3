<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Adsspot story avatar — default (unwatched) -->
  <!-- Spot ring: one squircle path drawn 4 times, each showing a quarter via dash offset -->
  <defs>
    <rect id="spotRing" x="2.5" y="2.5" width="75" height="75" rx="18" pathLength="100" fill="none"/>
    <clipPath id="storyPhotoClip">
      <rect x="9" y="9" width="62" height="62" rx="14"/>
    </clipPath>
  </defs>

  <use href="#spotRing" stroke="#4787F2" stroke-width="5" stroke-dasharray="26 74" stroke-dashoffset="0"/>
  <use href="#spotRing" stroke="#35AB4E" stroke-width="5" stroke-dasharray="26 74" stroke-dashoffset="-25"/>
  <use href="#spotRing" stroke="#F2B604" stroke-width="5" stroke-dasharray="26 74" stroke-dashoffset="-50"/>
  <use href="#spotRing" stroke="#981837" stroke-width="5" stroke-dasharray="26 74" stroke-dashoffset="-75"/>

  <!-- Photo slot: replace this group with your image, e.g.
       <image href="business-logo.jpg" x="9" y="9" width="62" height="62"
              preserveAspectRatio="xMidYMid slice" clip-path="url(#storyPhotoClip)"/> -->
  <g clip-path="url(#storyPhotoClip)">
    <rect x="9" y="9" width="62" height="62" fill="#F4F6FB"/>
    <text x="40" y="46" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif"
          font-size="20" font-weight="700" fill="#17181C">RS</text>
  </g>
</svg>
